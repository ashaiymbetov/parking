name: parking

x-backend-env: &backend-env
  DATABASE_URL: postgres://parking:parking@postgres:5432/parking
  PORT: "3000"
  WORKER_POLL_MS: "5000"
  # Outgoing mail goes to Mailpit (web UI on :8025).
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Dev-only secret; set your own outside local runs.
  JWT_SECRET: dev-only-jwt-secret-change-me

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    ports:
      # 5433 on the host to avoid clashing with a local PostgreSQL.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-time init the entrypoint runs a temporary
      # server on the unix socket only, which must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U parking -d parking"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Initializing an empty volume took ~70 s on Docker Desktop for
      # Windows; failed checks during this period are not counted.
      start_period: 120s

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  backend:
    build: ./backend
    environment:
      <<: *backend-env
      # Demo users (operator@ / driver1@ / driver2@parking.local, password
      # parking123). Idempotent; remove for a clean database.
      SEED_DEMO: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First start applies migrations and hashes demo passwords (scrypt).
      start_period: 120s

  worker:
    build: ./backend
    command: ["node", "dist/main.worker.js"]
    environment: *backend-env
    depends_on:
      # The API applies migrations on start; the worker waits for it.
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
